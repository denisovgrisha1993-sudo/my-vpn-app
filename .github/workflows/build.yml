name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Эта строчка позволит нам запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Я пока закомментировал шаги сборки, чтобы конвейер не выдал ошибку из-за пустого репозитория
      # Позже мы раскомментируем их!
      # - run: flutter pub get
      # - run: flutter build apk --release
      
      - name: Test Build Server
        run: echo "Сборочный конвейер для VR готов к работе!"
